spring:
  application:
    name: hotel-backend

  # ============================================================
  # DATABASE - MICROSOFT SQL SERVER 2022
  # ============================================================
  datasource:
    url: jdbc:sqlserver://127.0.0.1:1433;databaseName=hotel_management;encrypt=true;trustServerCertificate=true
    username: hotel_app
    password: HotelApp@12345
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # ============================================================
  # JPA / HIBERNATE
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata

  # ============================================================
  # FLYWAY DATABASE MIGRATION
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ============================================================
  # JACKSON
  # ============================================================
  jackson:
    default-property-inclusion: non_null


# ============================================================
# SERVER
# ============================================================
server:
  port: 8080


# ============================================================
# JWT SECURITY
# ============================================================
security:
  jwt:
    secret: ${JWT_SECRET:change_this_secret_in_environment}
    expiration-ms: ${JWT_EXPIRATION:86400000}
    refresh-expiration-ms: ${REFRESH_EXPIRATION:2592000000}


# ============================================================
# APPLICATION
# ============================================================
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  integration-secret: ${INTEGRATION_SECRET:${JWT_SECRET:change_this_secret_in_environment}}
  zomato:
    webhook-secret: ${ZOMATO_WEBHOOK_SECRET:}
  swiggy:
    webhook-secret: ${SWIGGY_WEBHOOK_SECRET:}
  ondc:
    webhook-secret: ${ONDC_WEBHOOK_SECRET:}
  magicpin:
    webhook-secret: ${MAGICPIN_WEBHOOK_SECRET:}


# ============================================================
# SWAGGER / OPENAPI
# ============================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html


# ============================================================
# ACTUATOR
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info

