spring:
  application:
    name: hotel-backend

  # ============================================================
  # DATABASE - SINGLE APPLICATION DATASOURCE (SQL SERVER)
  # ============================================================
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: ${DATABASE_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=hotel_management;encrypt=false;trustServerCertificate=true}
    username: ${DATABASE_USER:hotel_app}
    password: ${DATABASE_PASSWORD:HotelApp@12345}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  # ============================================================
  # JPA / HIBERNATE
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          time_zone: Asia/Kolkata

  # ============================================================
  # FLYWAY DATABASE MIGRATION
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ============================================================
  # JACKSON
  # ============================================================
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # ============================================================
  # MAIL CONFIGURATION (SMTP)
  # ============================================================
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:omchaudhari553@gmail.com}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:rcok jodn lbbi ygpi}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# ============================================================
# SERVER
# ============================================================
server:
  port: 8080

# ============================================================
# JWT SECURITY
# ============================================================
security:
  jwt:
    secret: ${JWT_SECRET:change_this_secret_in_environment}
    expiration-ms: ${JWT_EXPIRATION:86400000}
    refresh-expiration-ms: ${REFRESH_EXPIRATION:2592000000}

# ============================================================
# APPLICATION
# ============================================================
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  integration-secret: ${INTEGRATION_SECRET:${JWT_SECRET:change_this_secret_in_environment}}

  subscription:
    trial-days: 28
    gst-rate: 18.0

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

# ============================================================
# SWAGGER / OPENAPI
# ============================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ============================================================
# ACTUATOR
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
